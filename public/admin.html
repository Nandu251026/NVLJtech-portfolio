<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | NVLJtech</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
    }
    a.btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
    }
    a.btn-back:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background-color: #182234;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
    }
    tr:hover {
      background-color: #243248;
    }
    .btn-delete {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-delete:hover {
      background-color: var(--danger);
      color: white;
    }
    .empty-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Contact Submissions Dashboard</h1>
      <a href="/" class="btn-back">← Back to Site</a>
    </header>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Message</th>
          <th>Date</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="submissionsTableBody">
        <tr>
          <td colspan="6" class="empty-state">Loading submissions...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const tableBody = document.getElementById('submissionsTableBody');

    async function fetchSubmissions() {
      try {
        const res = await fetch('/api/submissions');
        const data = await res.json();

        if (data.success && data.data.length > 0) {
          tableBody.innerHTML = data.data.map(item => `
            <tr>
              <td>#${item.id}</td>
              <td><strong>${escapeHtml(item.name)}</strong></td>
              <td><a href="mailto:${escapeHtml(item.email)}" style="color: var(--accent);">${escapeHtml(item.email)}</a></td>
              <td>${escapeHtml(item.message)}</td>
              <td style="color: var(--text-muted); font-size: 0.85rem;">
                ${new Date(item.created_at).toLocaleString()}
              </td>
              <td>
                <button class="btn-delete" onclick="deleteSubmission(${item.id})">Delete</button>
              </td>
            </tr>
          `).join('');
        } else {
          tableBody.innerHTML = `<tr><td colspan="6" class="empty-state">No submissions found.</td></tr>`;
        }
      } catch (err) {
        console.error(err);
        tableBody.innerHTML = `<tr><td colspan="6" class="empty-state" style="color: var(--danger);">Failed to load data.</td></tr>`;
      }
    }

    async function deleteSubmission(id) {
      if (!confirm(`Delete submission #${id}?`)) return;
      try {
        const res = await fetch(`/api/submissions/${id}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          fetchSubmissions();
        } else {
          alert('Delete failed: ' + result.error);
        }
      } catch (err) {
        console.error(err);
        alert('Network error while deleting.');
      }
    }

    function escapeHtml(str) {
      return str ? str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag)) : '';
    }

    fetchSubmissions();
  </script>
</body>
</html>
